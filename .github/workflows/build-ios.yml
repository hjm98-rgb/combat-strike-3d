name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
          unzip -o Godot_v4.2.1-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download and Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -o Godot_v4.2.1-stable_export_templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$TEMPLATE_DIR/"
          ls -la "$TEMPLATE_DIR/"

      - name: Import Project
        run: godot --headless --import

      - name: Build iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/CombatStrike3D.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CombatStrike3D-iOS
          path: build/ios/*
