name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
          unzip -o Godot_v4.2.1-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable
          unzip -o Godot_v4.2.1-stable_export_templates.tpz "templates/ios_*" -d /tmp/templates
          cp /tmp/templates/templates/ios_debug.xcframework ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable/
          cp /tmp/templates/templates/ios_release.xcframework ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable/
          cp /tmp/templates/templates/version.txt ~/Library/Application\ Support/Godot/export_templates/4.2.1.stable/

      - name: Import Project
        run: godot --headless --import

      - name: Build iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/CombatStrike3D.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CombatStrike3D-iOS
          path: build/ios/*
