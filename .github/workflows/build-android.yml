name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -o Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download and Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -o Godot_v4.2.1-stable_export_templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$TEMPLATE_DIR/"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Create Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.2.tres" << 'EOF'
          [gd_resource type="EditorSettings" format=3]
          resource_name = "EditorSettings"

          [resource]
          exported/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          exported/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          exported/android/debug_keystore_user = "androiddebugkey"
          exported/android/debug_keystore_pass = "android"
          EOF

      - name: Import Project
        run: godot --headless --import --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/CombatStrike3D.apk
          ls -la build/android/
          if [ ! -f build/android/CombatStrike3D.apk ]; then
            echo "ERROR: Export did not produce apk file"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CombatStrike3D-Android
          path: build/android/*
