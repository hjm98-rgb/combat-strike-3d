name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -o Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          unzip -o Godot_v4.2.1-stable_export_templates.tpz "templates/windows_*" -d /tmp/templates
          cp /tmp/templates/templates/windows_debug_x86_64.exe ~/.local/share/godot/export_templates/4.2.1.stable/
          cp /tmp/templates/templates/windows_release_x86_64.exe ~/.local/share/godot/export_templates/4.2.1.stable/
          cp /tmp/templates/templates/version.txt ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Import Project
        run: godot --headless --import

      - name: Build Windows EXE
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/CombatStrike3D.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CombatStrike3D-Windows
          path: build/windows/*
